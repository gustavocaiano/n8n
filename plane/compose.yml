# n8n (Plane/GitLab integration instance) behind the existing Nginx Proxy Manager.
# On the host, NPM runs from ~/npm/docker-compose.yml and owns the
# `nginx-proxy-network` bridge (literal name). Start NPM first, then this stack.
# In NPM, add a Proxy Host forwarding to `n8n-plane:5678` (container name =
# DNS name on the shared network).
services:
  n8n-plane:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-plane
    restart: always
    # No host ports: n8n is reachable only via NPM through the shared network.
    # For local debugging, uncomment (localhost-bound; 5679 avoids clashes):
    # ports:
    #   - "127.0.0.1:5679:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https          # NPM terminates TLS; public URL is https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # Vortex announcements (see files/vortex-announcements/README.md):
      # - VORTEX_PUBLISH_TOKEN: webhook auth token, sent by Abilio as the
      #   X-Vortex-Publish-Token header and validated by the workflow
      # - VORTEX_SIDECAR_TOKEN: token n8n sends to vortex-publisher as
      #   X-Publisher-Token
      - VORTEX_PUBLISH_TOKEN=${VORTEX_PUBLISH_TOKEN}
      - VORTEX_SIDECAR_TOKEN=${VORTEX_SIDECAR_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - nginx-proxy-network
    # The host runs Tailscale, which overwrites /etc/resolv.conf to point at
    # MagicDNS (100.100.100.100). Docker bridges that upstream to containers,
    # but the Tailscale IP isn't reliably reachable from a bridge network, so
    # external DNS resolution fails. Pin public resolvers — same as the NPM
    # service in ~/npm/docker-compose.yml does.
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ─── Vortex announcements ─────────────────────────────────────────────────
  # Publisher sidecar: owns the vortex_feed volume and performs atomic feed
  # replacements for the n8n workflow "Vortex Announcements Publisher".
  # No host ports — reachable only inside the network as vortex-publisher:8085.
  vortex-publisher:
    image: node:22-alpine
    container_name: vortex-publisher
    restart: always
    environment:
      - VORTEX_SIDECAR_TOKEN=${VORTEX_SIDECAR_TOKEN}
    volumes:
      - vortex_feed:/data
      - ./vortex-announcements/publisher:/app:ro
    entrypoint: ['/bin/sh', '/app/entrypoint.sh']
    networks:
      - nginx-proxy-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8085/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Static feed server: nginx serves latest.json straight off the shared
  # volume. In NPM, add a custom location /vortex on the n8n proxy host
  # forwarding to http://vortex-feed:80 — no path suffix (the public path
  # /vortex/latest.json must reach the container unchanged).
  vortex-feed:
    image: nginx:1.27-alpine
    container_name: vortex-feed
    restart: always
    environment:
      # Whitespace-separated user:password pairs for HTTP Basic auth, one
      # per Vortex NUC. Empty = public feed.
      - VORTEX_FEED_READERS=${VORTEX_FEED_READERS}
      - VORTEX_FEED_AUTH_REALM=${VORTEX_FEED_AUTH_REALM:-Vortex announcements}
    volumes:
      - vortex_feed:/srv/feed:ro
      - ./vortex-announcements/nginx/templates:/etc/nginx/templates:ro
      - ./vortex-announcements/nginx/entrypoint/25-vortex-readers.sh:/docker-entrypoint.d/25-vortex-readers.sh:ro
    networks:
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    external: true
    name: nginx-proxy-network

volumes:
  n8n_data:
  # Owned by vortex-publisher; mounted read-only into vortex-feed.
  vortex_feed:
